name: Build Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-26" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x launcher/gradlew

      - name: Build Release APK
        run: |
          cd launcher
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"
        env:
          GRADLE_OPTS: "-Xmx3g"

      - name: Verify APK
        run: |
          ls -la launcher/app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-launcher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          retention-days: 7
